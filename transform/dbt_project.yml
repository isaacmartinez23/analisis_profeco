name: qqp
version: "0.1.0"
config-version: 2
profile: qqp

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  canasta_version: "v1"   # D-022: 16 alimentos. v0 se conserva en el seed como historial.
  # Reglas de atípicos (ver docs/reglas_calidad.md)
  atipico_factor_mediana: 10     # Q-ATIP-01: precio > 10× o < 1/10 de la mediana del producto
  atipico_umbral_mad: 5          # Q-ATIP-02: |log(precio) − mediana| > 5 × MAD escalada...
  atipico_factor_minimo_mad: 3   # ...y además a más de 3× o menos de 1/3 de la mediana (no marca promociones)
  atipico_min_observaciones: 30  # Q-ATIP-02 solo aplica con suficiente historia
  # Ventana de la serie semanal (D-010): semana actual + semanas previas
  semanas_ventana_previas: 1

models:
  qqp:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    dimensions:
      +materialized: table
      +schema: core
    facts:
      +materialized: table
      +schema: core
    marts:
      +materialized: table
      +schema: marts

seeds:
  qqp:
    +schema: seeds
