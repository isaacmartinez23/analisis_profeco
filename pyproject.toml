[project]
name = "profeco-canasta-multiagente"
version = "0.1.0"
description = "Pipeline reproducible de precios PROFECO QQP: ingesta, calidad, normalización, dbt y publicación."
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb>=1.5",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.10",
    "rarfile>=4.2",
    "pandas>=2.2",
    "pyarrow>=16",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]
# PostgreSQL embebido para correr en local las pruebas de integración del publicador (en CI se usa un servicio).
pg-local = ["pgserver>=0.1.4"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["data", "transform/target", "transform/dbt_packages"]

[tool.ruff.format]
# Los notebooks se generan con analysis/build_notebook.py; se lintean pero no se reformatean.
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# `ruff format` controla el largo del código; el SQL embebido puede exceder la línea.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
